name: sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      # install-user.mjs runs `bun install` for a captured plugins layer; the server
      # self-check below exercises that path, so bun must be on PATH first.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: npm ci
      # Advisory gate for the npm production tree; a vulnerable pin fails the job.
      - run: npm audit --omit=dev --audit-level=low
      # License gate for the npm tree; a missing or non-allowlisted license fails the job.
      - run: node license-gate.mjs
      # Architecture gates run in order; sync.mjs needs a data repo, so it is smoked
      # against the committed fixture into a throwaway target dir (the .test.mjs
      # scripts are hermetic, and a bare run would write this job's own home).
      # home-guard.test.mjs brackets the chain: record snapshots this runner's home,
      # and the check in the last step fails the job when it changed mid-chain.
      - run: node zero-deps.test.mjs && node license-gate.test.mjs && node crlf.test.mjs && node home-guard.test.mjs && node home-guard.test.mjs record && node sync.mjs "$(mktemp -d)" --data examples/data && node sync.test.mjs && node install-user.test.mjs && node sync-user.test.mjs && node sync-projects.test.mjs && node install-projects.test.mjs && node architecture.test.mjs && node clone.test.mjs && node skills/create-data-repo/scan-secrets.test.mjs && node scripts/mutant-run.test.mjs
      - run: npx tsc --noEmit && node lib/env-proxy.test.mjs && node server.test.mjs && node home-guard.test.mjs check
