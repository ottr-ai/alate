# The port stays on the host loopback. Put a TLS reverse proxy in front for remote access.
services:
  alate:
    image: ghcr.io/ottr-ai/alate:latest
    build: .
    ports:
      - "127.0.0.1:4570:4570"
    command: ["node", "server.ts", "--config", "/state/server-config.json"]
    environment:
      - ALATE_API_KEY
      # GitHub host for dashboard data-repo imports (github.com default, GHE cloud/server).
      - ALATE_GITHUB_HOST
      # Each provision installs into .alate/layers/<id> and switches .alate/current with one
      # atomic rename, so a provision never changes files a running turn reads. Unset for the
      # in-place install.
      - ALATE_LAYER=1
      # Proxy-only egress: update checks need the proxy. Node 24 reads these variables at
      # startup; the image already sets NODE_USE_ENV_PROXY=1, and NO_PROXY keeps internal
      # hosts on the direct route.
      - HTTP_PROXY
      - HTTPS_PROXY
      - NO_PROXY
    volumes:
      - state:/state
      - home:/root
    restart: unless-stopped

# The server prints the first-start key with: docker compose logs alate
volumes:
  state:
  home:
